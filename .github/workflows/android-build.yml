name: Build Teer Online Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'onesignal-bridge.js'
      - 'index.html'
      - 'biometric-bridge.js'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'
  push:
    branches:
      - main
    paths:
      - 'onesignal-bridge.js'
      - 'index.html'
      - 'biometric-bridge.js'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools were not found."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build debug APK
        run: npm run android:debug

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TeerOnline-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeerOnline-debug-apk
          path: TeerOnline-debug.apk
          if-no-files-found: error
          retention-days: 14
