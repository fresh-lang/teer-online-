name: Build Teer Online Android APK

on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build debug APK
        run: npm run android:debug

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TeerOnline-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeerOnline-debug-apk
          path: TeerOnline-debug.apk
          if-no-files-found: error
          retention-days: 14
