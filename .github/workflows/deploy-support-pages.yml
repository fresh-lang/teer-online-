name: Deploy Teer Online Website and Support to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "admin.html"
      - "icon-192.png"
      - "icon-512.png"
      - "logo.png"
      - "manifest.json"
      - "native-back-bridge.js"
      - "onesignal-bridge.js"
      - "sw.js"
      - "update-bridge.js"
      - "support/**"
      - ".github/workflows/deploy-support-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare complete website
        run: |
          mkdir -p public/support
          cp index.html admin.html icon-192.png icon-512.png logo.png manifest.json native-back-bridge.js onesignal-bridge.js sw.js update-bridge.js public/
          cp support/index.html support/agent.html public/support/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
