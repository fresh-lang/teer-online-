name: Build Android APK and publish download

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Configure persistent Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: ANDROID_DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          EXPECTED_CERT_SHA256="1ffcc914d536a33f58f981ddd854acb1e1e55c63f536806c916a357430ef8de9"
          KEYSTORE_CERT_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ {v=$NF; gsub(/:/, "", v); print tolower(v); exit}')"
          echo "Decoded keystore certificate: $KEYSTORE_CERT_SHA256"
          if [ "$KEYSTORE_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::GitHub secret keystore does not match the expected signing certificate."
            exit 1
          fi
      - name: Prepare and add Android project
        run: |
          npm run build:onesignal
          echo "{\"build\":${GITHUB_RUN_NUMBER}}" > www/build-info.json
          npx cap add android
          cat >> android/app/build.gradle <<'GRADLE'

          // Use the verified persistent keystore for every debug APK build.
          android {
              signingConfigs {
                  debug {
                      storeFile new File(System.getProperty('user.home'), '.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
      - name: Generate Android launcher icon from Teer Online logo
        run: |
          mkdir -p resources
          node -e "require('sharp')('icon-512.png').resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('Launcher icon prepared'))"
          npx --yes @capacitor/assets generate --android
      - name: Set Android app version for in-place updates
        run: |
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk teer-online.apk
      - name: Verify APK signature and alignment
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs teer-online.apk)"
          printf '%s\n' "$CERT_OUTPUT"
          EXPECTED_CERT_SHA256="1ffcc914d536a33f58f981ddd854acb1e1e55c63f536806c916a357430ef8de9"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | awk 'tolower($0) ~ /certificate sha-256 digest/ {v=$NF; gsub(/[^[:xdigit:]]/, "", v); print tolower(v); exit}')"
          echo "Expected signing certificate: $EXPECTED_CERT_SHA256"
          echo "Actual signing certificate:   $ACTUAL_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match the installed app. Refusing to publish an incompatible update."
            exit 1
          fi
          "$ZIPALIGN" -c -v 4 teer-online.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teer-online-apk
          path: teer-online.apk
          if-no-files-found: error
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Teer Online APK build ${{ github.run_number }}
          files: teer-online.apk
          make_latest: true
