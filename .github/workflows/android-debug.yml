name: Build Android APK and publish download

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: teer-online-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Configure persistent Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: ANDROID_DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          EXPECTED_CERT_SHA256="1ffcc914d536a33f58f981ddd854acb1e1e55c63f536806c916a357430ef8de9"
          KEYSTORE_CERT_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ {v=$NF; gsub(/:/, "", v); print tolower(v); exit}')"
          echo "Decoded keystore certificate: $KEYSTORE_CERT_SHA256"
          if [ "$KEYSTORE_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::GitHub secret keystore does not match the expected signing certificate."
            exit 1
          fi
      - name: Prepare and add Android project
        run: |
          npm run build:onesignal
          echo "{\"build\":${GITHUB_RUN_NUMBER}}" > www/build-info.json
          npx cap add android
          # Native updater downloads the signed APK and opens Android's package installer.
          cat > android/app/src/main/java/com/freshlang/teeronline/TeerAppUpdaterPlugin.java <<'JAVA'
          package com.freshlang.teeronline;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "TeerAppUpdater")
          public class TeerAppUpdaterPlugin extends Plugin {
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  String link = call.getString("url", "");
                  if (link.isEmpty() || !link.startsWith("https://github.com/")) {
                      call.reject("Only the official secure GitHub APK link is allowed.");
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      !getContext().getPackageManager().canRequestPackageInstalls()) {
                      try {
                          Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getContext().getPackageName()));
                          getActivity().startActivity(settings);
                          JSObject result = new JSObject();
                          result.put("needsPermission", true);
                          call.resolve(result);
                      } catch (Exception e) {
                          call.reject("Please allow Teer Online to install app updates.", e);
                      }
                      return;
                  }

                  executor.execute(() -> {
                      HttpURLConnection connection = null;
                      try {
                          File folder = new File(getContext().getCacheDir(), "updates");
                          if (!folder.exists() && !folder.mkdirs()) throw new Exception("Cannot create update folder");
                          File apk = new File(folder, "teer-online.apk");
                          URL target = new URL(link);
                          connection = (HttpURLConnection) target.openConnection();
                          connection.setInstanceFollowRedirects(true);
                          connection.setConnectTimeout(20000);
                          connection.setReadTimeout(60000);
                          connection.setRequestProperty("User-Agent", "TeerOnline-Android-Updater");
                          int status = connection.getResponseCode();
                          if (status != HttpURLConnection.HTTP_OK) throw new Exception("Download failed (HTTP " + status + ")");
                          String type = connection.getContentType();
                          if (type != null && !type.toLowerCase().contains("apk") &&
                              !type.toLowerCase().contains("octet-stream")) {
                              throw new Exception("The server did not return an APK file");
                          }
                          long total = connection.getContentLength();
                          long received = 0;
                          try (BufferedInputStream in = new BufferedInputStream(connection.getInputStream());
                               FileOutputStream out = new FileOutputStream(apk)) {
                              byte[] buffer = new byte[16384];
                              int count;
                              while ((count = in.read(buffer)) != -1) {
                                  out.write(buffer, 0, count);
                                  received += count;
                                  if (total > 0) {
                                      JSObject progress = new JSObject();
                                      progress.put("percent", Math.min(99, (int) (received * 100 / total)));
                                      notifyListeners("downloadProgress", progress);
                                  }
                              }
                              out.flush();
                          }
                          if (!apk.isFile() || apk.length() < 100000) throw new Exception("Downloaded APK is incomplete");
                          Uri contentUri = FileProvider.getUriForFile(getContext(),
                              getContext().getPackageName() + ".fileprovider", apk);
                          Intent install = new Intent(Intent.ACTION_VIEW);
                          install.setDataAndType(contentUri, "application/vnd.android.package-archive");
                          install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                          getActivity().runOnUiThread(() -> {
                              try {
                                  getActivity().startActivity(install);
                                  JSObject result = new JSObject();
                                  result.put("downloaded", true);
                                  call.resolve(result);
                              } catch (Exception e) {
                                  call.reject("Could not open Android installer.", e);
                              }
                          });
                      } catch (Exception e) {
                          call.reject("Update download/install failed: " + e.getMessage(), e);
                      } finally {
                          if (connection != null) connection.disconnect();
                      }
                  });
              }
          }
          JAVA
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/teer_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="apk_updates" path="updates/" />
          </paths>
          XML
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree=ET.parse(p)
          root=tree.getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          permission='android.permission.REQUEST_INSTALL_PACKAGES'
          if not any(x.get(ns+'name') == permission for x in root.findall('uses-permission')):
              ET.SubElement(root, 'uses-permission', {ns+'name': permission})
          app=root.find('application')
          provider_name='androidx.core.content.FileProvider'
          provider=next((x for x in app.findall('provider') if x.get(ns+'name') == provider_name), None)
          if provider is None:
              provider=ET.SubElement(app, 'provider')
          provider.set(ns+'name', provider_name)
          provider.set(ns+'authorities', '${applicationId}.fileprovider')
          provider.set(ns+'exported', 'false')
          provider.set(ns+'grantUriPermissions', 'true')
          meta=next((x for x in provider.findall('meta-data') if x.get(ns+'name') == 'android.support.FILE_PROVIDER_PATHS'), None)
          if meta is None: meta=ET.SubElement(provider, 'meta-data')
          meta.set(ns+'name', 'android.support.FILE_PROVIDER_PATHS')
          meta.set(ns+'resource', '@xml/teer_file_paths')
          tree.write(p, encoding='utf-8', xml_declaration=True)
          PY
          # Bundle a dedicated alert tone so Android does not depend on the
          # device's possibly silent/default notification ringtone.
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math, struct, wave
          rate = 44100
          notes = [(880, 0.18), (1175, 0.18), (880, 0.28)]
          samples = []
          for frequency, duration in notes:
              count = int(rate * duration)
              for i in range(count):
                  edge = min(1.0, i / 500, (count - 1 - i) / 700)
                  envelope = max(0.0, edge)
                  value = int(10500 * envelope * math.sin(2 * math.pi * frequency * i / rate))
                  samples.append(struct.pack('<h', value))
              samples.extend([b'\x00\x00'] * int(rate * 0.045))
          with wave.open('android/app/src/main/res/raw/teer_notification.wav', 'wb') as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(rate)
              audio.writeframes(b''.join(samples))
          PY
          mkdir -p android/app/src/main/java/com/freshlang/teeronline
          cat > android/app/src/main/java/com/freshlang/teeronline/MainActivity.java <<'JAVA'
          package com.freshlang.teeronline;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TeerAppUpdaterPlugin.class);
                  registerPlugin(TeerDeviceCredentialPlugin.class);
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      final String channelId = "teer_results_sound_v6";
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null && manager.getNotificationChannel(channelId) == null) {
                          Uri sound = Uri.parse("android.resource://" + getPackageName() + "/" + R.raw.teer_notification);
                          AudioAttributes audio = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build();
                          NotificationChannel channel = new NotificationChannel(
                              channelId,
                              "Teer Online Results (Sound Alerts)",
                              NotificationManager.IMPORTANCE_HIGH
                          );
                          channel.setDescription("Sound alerts for FR/SR results and Teer Online notifications");
                          channel.setSound(sound, audio);
                          channel.setVibrationPattern(new long[] { 0, 350, 180, 350 });
                          channel.setShowBadge(true);
                          channel.enableVibration(true);
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/com/freshlang/teeronline/TeerDeviceCredentialPlugin.java <<'JAVA'
          package com.freshlang.teeronline;

          import android.app.KeyguardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.activity.result.ActivityResult;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TeerDeviceCredential")
          public class TeerDeviceCredentialPlugin extends Plugin {
              private BiometricPrompt activePrompt;

              @PluginMethod
              public void authenticate(PluginCall call) {
                  KeyguardManager keyguard = (KeyguardManager) getContext().getSystemService(Context.KEYGUARD_SERVICE);
                  if (keyguard == null || !keyguard.isDeviceSecure()) {
                      call.reject("Set a Pattern, PIN or Password in Android Settings first.");
                      return;
                  }

                  // Android 11+ must use BiometricPrompt with DEVICE_CREDENTIAL.
                  // Avoid the deprecated Keyguard confirmation intent on Android 11–15.
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      try {
                          BiometricPrompt.PromptInfo promptInfo = new BiometricPrompt.PromptInfo.Builder()
                              .setTitle("Unlock Teer Online")
                              .setSubtitle("Enter your phone Pattern, PIN or Password")
                              .setAllowedAuthenticators(BiometricManager.Authenticators.DEVICE_CREDENTIAL)
                              .build();
                          activePrompt = new BiometricPrompt(
                              getActivity(),
                              ContextCompat.getMainExecutor(getContext()),
                              new BiometricPrompt.AuthenticationCallback() {
                                  @Override
                                  public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                      activePrompt = null;
                                      call.resolve();
                                  }
                                  @Override
                                  public void onAuthenticationError(int errorCode, CharSequence errString) {
                                      activePrompt = null;
                                      call.reject("Phone Pattern / PIN / Password was not verified: " + errString);
                                  }
                              }
                          );
                          activePrompt.authenticate(promptInfo);
                      } catch (Exception e) {
                          activePrompt = null;
                          call.reject("Could not open Android device-credential prompt: " + e.getMessage(), e);
                      }
                      return;
                  }

                  // Android 5–10: use the system's dedicated Pattern/PIN/Password screen.
                  try {
                      Intent credentialIntent = keyguard.createConfirmDeviceCredentialIntent(
                          "Unlock Teer Online",
                          "Enter your phone Pattern, PIN or Password"
                      );
                      if (credentialIntent != null) {
                          startActivityForResult(call, credentialIntent, "deviceCredentialResult");
                      } else {
                          call.reject("Android did not provide the phone screen-lock prompt. Check that Pattern, PIN or Password is enabled.");
                      }
                  } catch (Exception e) {
                      call.reject("Could not open the phone Pattern / PIN / Password screen: " + e.getMessage(), e);
                  }
              }

              @ActivityCallback
              private void deviceCredentialResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  if (result.getResultCode() == android.app.Activity.RESULT_OK) {
                      call.resolve();
                  } else {
                      call.reject("Phone Pattern / PIN / Password was cancelled or not verified.");
                  }
              }
          }
          JAVA
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          GRADLE

          cat >> android/app/build.gradle <<'GRADLE'

          // Use the verified persistent keystore for every debug APK build.
          android {
              signingConfigs {
                  debug {
                      storeFile new File(System.getProperty('user.home'), '.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
      - name: Generate Android launcher icon from Teer Online logo
        run: |
          mkdir -p resources
          node -e "require('sharp')('icon-512.png').resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('Launcher icon prepared'))"
          npx --yes @capacitor/assets generate --android
      - name: Set Android app version for in-place updates
        run: |
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          npx cap sync android
          if ! grep -R -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml android/app/build/intermediates/merged_manifest 2>/dev/null; then
            echo '::error::APK installer permission is missing.'
            exit 1
          fi
          grep -q 'TeerAppUpdaterPlugin' android/app/src/main/java/com/freshlang/teeronline/TeerAppUpdaterPlugin.java
          grep -q 'teer_file_paths' android/app/src/main/AndroidManifest.xml
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk teer-online.apk
      - name: Verify APK signature and alignment
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs teer-online.apk)"
          printf '%s\n' "$CERT_OUTPUT"
          EXPECTED_CERT_SHA256="1ffcc914d536a33f58f981ddd854acb1e1e55c63f536806c916a357430ef8de9"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | awk 'tolower($0) ~ /certificate sha-256 digest/ {v=$NF; gsub(/[^[:xdigit:]]/, "", v); print tolower(v); exit}')"
          echo "Expected signing certificate: $EXPECTED_CERT_SHA256"
          echo "Actual signing certificate:   $ACTUAL_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match the installed app. Refusing to publish an incompatible update."
            exit 1
          fi
          "$ZIPALIGN" -c -v 4 teer-online.apk
      - name: Confirm this is still the latest branch commit
        id: freshness
        run: |
          git fetch origin "$GITHUB_REF_NAME" --quiet
          LATEST_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping obsolete APK from $GITHUB_SHA; current branch is $LATEST_SHA"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload APK artifact
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: teer-online-apk
          path: teer-online.apk
          if-no-files-found: error
      - name: Publish APK download
        if: steps.freshness.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Teer Online APK build ${{ github.run_number }}
          files: teer-online.apk
          make_latest: true

      - name: Post APK update to Telegram channel
        if: steps.freshness.outputs.publish == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-${GITHUB_RUN_NUMBER}/teer-online.apk"
          MESSAGE="📢 TEER ONLINE – NEW UPDATE AVAILABLE!

          Version: 1.0.${GITHUB_RUN_NUMBER}

          ⬇️ Download the latest official APK:
          ${APK_URL}

          Please install the latest version.

          TEER ONLINE OFFICIAL"
          curl --fail --silent --show-error --retry 3 \
            --request POST \
            --data-urlencode "chat_id=@teerofficiall" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
