name: Build Android APK and publish download

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare and add Android project
        run: |
          npm run build:onesignal
          npx cap add android
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
      - name: Generate Android launcher icon from Teer Online logo
        run: |
          mkdir -p resources
          convert icon-512.png -resize 1024x1024 resources/icon.png
          npx --yes @capacitor/assets generate --android
      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk teer-online.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teer-online-apk
          path: teer-online.apk
          if-no-files-found: error
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Teer Online APK build ${{ github.run_number }}
          files: teer-online.apk
          make_latest: true
