<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teer Online Agent Desk</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#edf2f2;color:#142b2b}.bar{background:#073b3b;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:18px auto;padding:0 12px}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px}.card{background:white;border-radius:16px;padding:16px;box-shadow:0 6px 24px #001b1b12}.field{width:100%;padding:12px;border:1px solid #d4dfdf;border-radius:10px;margin:5px 0 12px}.btn{background:#073b3b;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.list{max-height:68vh;overflow:auto}.item{padding:12px;border-bottom:1px solid #e8eeee;cursor:pointer}.item.active{background:#e9f5f2}.muted{font-size:12px;color:#708080}.msgs{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px 0}.bubble{max-width:82%;padding:10px 12px;background:#edf2f2;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#0b514b;color:white}.bubble img{max-width:240px;display:block;border-radius:9px;margin-top:6px}.sendrow{display:flex;gap:8px}.sendrow input{flex:1;min-width:0;padding:12px;border:1px solid #d4dfdf;border-radius:10px}.hide{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.list{max-height:28vh}.msgs{height:42vh}}
</style></head><body>
<header class="bar"><strong>Teer Online • Agent Desk</strong><span id="who">Offline</span></header>
<main class="wrap">
<section id="login" class="card" style="max-width:420px;margin:8vh auto"><h2>Agent Login</h2><p class="muted">Sign in with your approved Teer Online admin/agent account.</p><form id="loginForm"><label>Mobile number</label><input id="phone" class="field" inputmode="numeric" required><label>Password</label><input id="password" class="field" type="password" required><button class="btn" style="width:100%">Login</button></form><p id="loginError" class="muted"></p></section>
<section id="desk" class="grid hide"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Open chats</strong><button id="refresh" class="btn">Refresh</button></div><div id="conversations" class="list"></div></div><div class="card"><div><strong id="chatTitle">Select a conversation</strong><p id="chatMeta" class="muted"></p></div><div id="agentMessages" class="msgs"></div><form id="replyForm" class="sendrow"><input id="reply" maxlength="2000" placeholder="Reply to customer…" required><button class="btn">Send</button></form></div></section>
</main>
<script>
const API='https://qzbqmbrzmfggzzeufkyh.supabase.co/functions/v1/account-api';
const KEY='sb_publishable_Z2ij7JqELoVfBQ75wrSrFg_bKDt3aj1';
let session='',current='',timer=null;
const $=id=>document.getElementById(id);
async function api(action,payload={},auth=true){
 const h={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};if(auth&&session)h['x-session-token']=session;
 const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d;
}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='Signing in…';try{
 const d=await api('login',{phone:$('phone').value.trim(),password:$('password').value},false);session=d.session?.token||d.session?.session_token||d.session;if(typeof session!=='string')throw new Error('Login session missing');
 const p=await api('support_agent_heartbeat',{online:true});$('who').textContent=p.display_name+' • Online';$('login').classList.add('hide');$('desk').classList.remove('hide');await loadList();timer=setInterval(async()=>{try{await api('support_agent_heartbeat',{online:true});await loadList()}catch(_){}},25000);
 }catch(err){$('loginError').textContent=err.message}};
async function loadList(){const d=await api('admin_support_list');$('conversations').innerHTML='';(d.conversations||[]).forEach(c=>{const el=document.createElement('div');el.className='item'+(c.id===current?' active':'');const title=document.createElement('b');title.textContent=(c.app_users?.name||'Customer')+' • UID chat';const sub=document.createElement('div');sub.className='muted';sub.textContent=(c.category||'general')+' • '+(c.status||'open');const last=document.createElement('div');last.className='muted';last.textContent=c.last_message||'No messages yet';el.append(title,sub,last);el.onclick=()=>openConversation(c);$('conversations').append(el)})}
async function openConversation(c){current=c.id;$('chatTitle').textContent=c.app_users?.name||'Customer';$('chatMeta').textContent='UID customer • '+c.category+' • '+c.status;await loadMessages();await loadList()}
async function loadMessages(){if(!current)return;const d=await api('admin_support_messages',{conversation_id:current});$('agentMessages').innerHTML='';(d.messages||[]).forEach(m=>{const el=document.createElement('div');el.className='bubble '+(m.sender_role==='admin'?'mine':'');const label=document.createElement('small');label.style.display='block';label.style.opacity='.65';label.textContent=m.sender_role==='admin'?'You':'Customer';const body=document.createElement('div');body.textContent=m.message==='Image attachment'?'Screenshot':m.message;el.append(label,body);if(m.attachment_url){const img=document.createElement('img');img.src=m.attachment_url;img.alt='Customer screenshot';el.append(img)}$('agentMessages').append(el)});$('agentMessages').scrollTop=$('agentMessages').scrollHeight}
$('refresh').onclick=()=>loadList();
$('replyForm').onsubmit=async e=>{e.preventDefault();if(!current)return;const message=$('reply').value.trim();if(!message)return;try{await api('admin_support_reply',{conversation_id:current,message});$('reply').value='';await loadMessages();await loadList()}catch(err){alert(err.message)}};
window.addEventListener('beforeunload',()=>{if(session)fetch(API,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-session-token':session},body:JSON.stringify({action:'support_agent_heartbeat',online:false})})});
</script></body></html>
