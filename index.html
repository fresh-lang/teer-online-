            <button onclick="selectBetMode('house')" id="modeBtnHouse" class="flex-1 py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg border">House (1:9)</button>
            <button onclick="selectBetMode('ending')" id="modeBtnEnding" class="flex-1 py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg border">Ending (1:9)</button>
          </div>

          <!-- Direct Guti Grid 00-99 -->
          <div id="directGutiSection" class="space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-slate-700">Choose Numbers (00 - 99):</span>
              <button onclick="randomLuckyPick()" class="text-[11px] text-amber-600 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-md font-bold">🎲 Lucky Pick</button>
            </div>
            <div id="gutiGrid" class="grid grid-cols-10 gap-1 max-h-[160px] overflow-y-auto p-1 bg-slate-50 border rounded-xl"></div>
          </div>

          <!-- Digit 0-9 for House/Ending -->
          <div id="digitSection" class="hidden space-y-2">
            <span class="font-bold text-slate-700">Choose Digit (0 - 9):</span>
            <div class="grid grid-cols-5 gap-2">
              <button onclick="selectSingleDigit(0)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">0</button>
              <button onclick="selectSingleDigit(1)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">1</button>
              <button onclick="selectSingleDigit(2)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">2</button>
              <button onclick="selectSingleDigit(3)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">3</button>
              <button onclick="selectSingleDigit(4)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">4</button>
              <button onclick="selectSingleDigit(5)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">5</button>
              <button onclick="selectSingleDigit(6)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">6</button>
              <button onclick="selectSingleDigit(7)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">7</button>
              <button onclick="selectSingleDigit(8)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">8</button>
              <button onclick="selectSingleDigit(9)" class="digit-btn py-2 rounded-xl bg-slate-100 font-bold">9</button>
            </div>
          </div>

          <div>
            <label class="font-bold text-slate-700 block mb-1">Amount per number (₹):</label>
            <input type="number" id="betAmountInput" value="20" min="10" step="10" oninput="calculatePayout()" class="w-full border rounded-xl px-3 py-2 font-bold text-base outline-none">
          </div>

          <div class="bg-teal-50 border border-teal-200 rounded-xl p-2.5 flex justify-between items-center text-xs">
            <div>
              <p class="text-slate-500">Total Bet Cost:</p>
              <p id="totalBetCost" class="text-sm font-bold text-teal-900">₹0.00</p>
            </div>
            <div class="text-right">
              <p class="text-slate-500">Potential Return:</p>
              <p id="potentialWin" class="text-sm font-black text-amber-600">₹0.00</p>
            </div>
          </div>
        </div>

        <div class="p-3 bg-slate-50 border-t flex gap-2">
          <button onclick="closePlayModal()" class="flex-1 py-2.5 rounded-xl border font-bold text-slate-600 text-xs">Cancel</button>
          <button onclick="confirmPlaceBet()" class="flex-1 py-2.5 rounded-xl gold-btn font-bold text-xs shadow-md">Confirm Bid</button>
        </div>
      </div>
    </div>

    <!-- MODAL: DEPOSIT -->
    <div id="depositModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-end justify-center">
      <div class="bg-white w-full max-w-[480px] rounded-t-3xl max-h-[92vh] flex flex-col shadow-2xl p-4 overflow-y-auto space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-base text-teal-950">Add Money to Wallet</h3>
          <button onclick="closeDepositModal()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="bg-slate-50 border rounded-2xl p-3 text-center">
          <p class="text-xs font-bold text-teal-900 mb-1">SCAN QR TO PAY USING ANY UPI APP</p>
          <div class="w-40 h-40 mx-auto bg-white p-2 rounded-xl border flex items-center justify-center">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=8134834380@mbk%26pn=TeerOnline" class="w-full h-full">
          </div>
          <p class="text-xs font-mono font-bold mt-2">8134834380@mbk</p>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1">Enter 12-Digit UTR / Ref Number:</label>
          <input type="text" id="depositUtrInput" placeholder="e.g. 430198234823" maxlength="12" class="w-full border rounded-xl p-2 text-sm font-mono outline-none">
        </div>
        <button onclick="submitDepositForm()" class="w-full py-2.5 bg-teal-950 text-amber-300 font-bold rounded-xl text-xs">Submit (+5% Bonus)</button>
        <a href="https://wa.me/918134834380" target="_blank" class="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs text-center block">Send Slip on WhatsApp</a>
      </div>
    </div>

    <!-- MODAL: AUTHENTICATION -->
    <div id="authModal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl text-slate-800 space-y-3">
        <h3 class="text-center font-bold text-lg text-teal-950">TEER ONLINE LOGIN</h3>
        <p class="text-center text-xs text-slate-500">1 Number Se Sirf 1 ID Banegi</p>
        <form onsubmit="handleRegisterSubmit(event)" class="space-y-2.5">
          <input type="text" id="regName" placeholder="Full Name" required class="w-full border rounded-xl p-2 text-sm">
          <input type="tel" id="regPhone" placeholder="10-digit Mobile" maxlength="10" required class="w-full border rounded-xl p-2 text-sm">
          <input type="password" id="regPass" placeholder="Password" minlength="4" required class="w-full border rounded-xl p-2 text-sm">
          <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl font-bold text-xs shadow">Register &amp; Get ₹100 Bonus</button>
        </form>
        <button onclick="closeAuthModal()" class="w-full py-1 text-slate-400 text-xs">Skip for now</button>
      </div>
    </div>

  </div>

  <script>
    const state = {
      user: null,
      balance: 100.00,
      selectedNumbers: [],
      betMode: 'direct',
      currentRound: 'FR',
      currentMarket: 'Shilong Morning Teer',
      markets: [
        { id: 'shillong-m', name: 'Shilong Morning Teer', frTime: '10:20 AM', srTime: '11:20 AM', frRes: '**', srRes: '**' },
        { id: 'khanapara-m', name: 'Khanapara Morning Teer', frTime: '10:20 AM', srTime: '11:20 AM', frRes: '**', srRes: '**' },
        { id: 'assam-m', name: 'Assam morning teer', frTime: '11:30 AM', srTime: '12:30 PM', frRes: '**', srRes: '**' },
        { id: 'sikkim', name: 'Sikkim', frTime: '12:15 PM', srTime: '01:40 PM', frRes: '**', srRes: '**' },
        { id: 'sikkim-n', name: 'Sikkim Night Teer', frTime: '06:50 PM', srTime: '07:50 PM', frRes: '**', srRes: '**' },
        { id: 'shillong-n', name: 'Shillong Night Teer', frTime: '08:10 PM', srTime: '09:10 PM', frRes: '**', srRes: '**' },
        { id: 'assam-n', name: 'Assam night teer', frTime: '09:40 PM', srTime: '10:40 PM', frRes: '**', srRes: '**' }
      ]
    };

    window.addEventListener('DOMContentLoaded', () => {
      renderMarkets();
      renderGutiGrid();
      startBannerAutoSlider();
      updateUI();
    });

    function updateUI() {
      const b = '₹' + state.balance.toFixed(2);
      document.getElementById('headerBalance').innerText = b;
      document.getElementById('walletBalanceBig').innerText = b;
    }

    function switchTab(t) {
      document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
      const sc = document.getElementById('screen-' + t);
      if (sc) sc.classList.add('active');
    }

    function renderMarkets() {
      const cont = document.getElementById('marketCardsContainer');
      cont.innerHTML = '';
      state.markets.forEach(m => {
        const d = document.createElement('div');
        d.className = "bg-white rounded-2xl p-3 border shadow-sm space-y-2";
        d.innerHTML = `
          <div class="flex justify-between text-xs font-bold">
            <span>${m.name}</span>
            <span class="text-slate-400">01/11/2026</span>
          </div>
          <div class="grid grid-cols-2 gap-2 bg-[#f4f9f9] p-2 rounded-xl text-center">
            <div class="border-r"><p class="text-[11px] font-bold text-teal-900">FR (${m.frTime})</p><p class="text-xl font-bold">${m.frRes}</p></div>
            <div><p class="text-[11px] font-bold text-teal-900">SR (${m.srTime})</p><p class="text-xl font-bold">${m.srRes}</p></div>
          </div>
          <button onclick="openPlayModal('${m.name}')" class="w-full py-1.5 gold-btn rounded-lg text-xs font-bold">Play Game &gt;</button>
        `;
        cont.appendChild(d);
      });
    }

    function renderGutiGrid() {
      const g = document.getElementById('gutiGrid');
      g.innerHTML = '';
      for (let i = 0; i <= 99; i++) {
        const v = i < 10 ? '0' + i : '' + i;
        const b = document.createElement('button');
        b.innerText = v;
        b.id = 'guti-btn-' + v;
        b.className = "py-1 bg-white border rounded text-[10px] font-bold";
        b.onclick = () => {
          const idx = state.selectedNumbers.indexOf(v);
          if (idx > -1) state.selectedNumbers.splice(idx, 1);
          else state.selectedNumbers.push(v);
          calculatePayout();
        };
        g.appendChild(b);
      }
    }

    function calculatePayout() {
      const amt = parseFloat(document.getElementById('betAmountInput').value) || 0;
      const count = state.selectedNumbers.length;
      document.getElementById('totalBetCost').innerText = '₹' + (amt * count).toFixed(2);
      document.getElementById('potentialWin').innerText = '₹' + (amt * 90).toFixed(2);
    }

    function randomLuckyPick() {
      const r = Math.floor(Math.random() * 100);
      const v = r < 10 ? '0' + r : '' + r;
      if (!state.selectedNumbers.includes(v)) state.selectedNumbers.push(v);
      calculatePayout();
    }

    function selectRound(r) { state.currentRound = r; }
    function selectBetMode(m) {
      state.betMode = m;
      document.getElementById('directGutiSection').classList.toggle('hidden', m !== 'direct');
      document.getElementById('digitSection').classList.toggle('hidden', m === 'direct');
    }
    function selectSingleDigit(d) { state.selectedNumbers = ['' + d]; calculatePayout(); }

    function openPlayModal(m) {
      state.currentMarket = m;
      document.getElementById('playMarketTitle').innerText = m;
      document.getElementById('playGameModal').classList.remove('hidden');
    }
    function closePlayModal() { document.getElementById('playGameModal').classList.add('hidden'); }
    function openDepositModal() { document.getElementById('depositModal').classList.remove('hidden'); }
    function closeDepositModal() { document.getElementById('depositModal').classList.add('hidden'); }
    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

    function confirmPlaceBet() {
      const amt = parseFloat(document.getElementById('betAmountInput').value) || 0;
      const cost = amt * state.selectedNumbers.length;
      if (state.balance < cost) { alert('Low balance! Please deposit.'); return; }
      state.balance -= cost;
      updateUI();
      closePlayModal();
      alert('Bid placed successfully!');
    }

    function submitDepositForm() {
      const utr = document.getElementById('depositUtrInput').value;
      if (utr.length < 6) { alert('Valid UTR daalein!'); return; }
      state.balance += 525.00;
      updateUI();
      closeDepositModal();
      alert('₹500 + ₹25 (5% Bonus) credited!');
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const phone = document.getElementById('regPhone').value;
      const name = document.getElementById('regName').value;
      state.user = { name, phone };
      state.balance += 100.00;
      updateUI();
      closeAuthModal();
      alert('Registration successful! ₹100 Welcome Bonus added.');
    }

    function startBannerAutoSlider() {
      let f = true;
      setInterval(() => {
        f = !f;
        document.getElementById('slide1').style.opacity = f ? '1' : '0';
        document.getElementById('slide2').style.opacity = f ? '0' : '1';
      }, 4000);
    }

    function refreshBalance() { alert('Balance refreshed: ₹' + state.balance.toFixed(2)); }
    function toggleDrawer() { alert('Menu Drawer: Settings, Game Rates, Notifications active.'); }
  <\/script>
</body>
</html>
